map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend {
    server host.docker.internal:3000;
}

upstream backend {
    server backend:9000;
}

# =============================================================================
# Backend — Host: admin
# =============================================================================
server {
    listen 80;
    server_name admin;

    root /var/www/html/public;

    client_max_body_size 100M;
    client_body_timeout 36000s;
    client_header_timeout 36000s;
    client_body_buffer_size 100M;

    index index.php;

    # ---------------------------------------------------------------------------
    # SEO — иконка и robots.txt
    # ---------------------------------------------------------------------------
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Nova — статика (Mix /vendor/nova/*, asset() из NovaServiceProvider), затем UI и API
    # ---------------------------------------------------------------------------
    location ~* ^/(vendor|css|js|fonts)/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/(admin(/|$)|login$|nova-api/|nova-vendor/|set-locale/) {
        try_files $uri /index.php?$query_string;
    }

    # ---------------------------------------------------------------------------
    # PHP (единственный обработчик — index.php в public)
    # ---------------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 36000s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}

# =============================================================================
# Публичный сайт — Host: localhost (Storage, SEO, API, Next.js)
# Имя nginx: запросы из контейнера backend (FRONTEND_REVALIDATE_URL=http://nginx/...) иначе попадают в default-сервер admin.
# =============================================================================
server {
    listen 80;
    server_name localhost lhost nginx;

    root /var/www/html/public;

    # Публичный трафик: не держать 10h-таймауты и 100M-буфер тела запроса (загрузки медиа — через Nova / admin).
    client_max_body_size 16m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    client_body_buffer_size 128k;

    index index.php;

    # ---------------------------------------------------------------------------
    # Storage — пользовательские загрузки (public/storage → storage/app/public)
    # ---------------------------------------------------------------------------
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        log_not_found off;
        expires 30d;

        if ($http_origin ~* ^https?://admin(:[0-9]+)?$) {
            add_header Cache-Control "public, max-age=2592000" always;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Vary "Origin" always;
        }
        if ($http_origin !~* ^https?://admin(:[0-9]+)?$) {
            add_header Cache-Control "public, max-age=2592000" always;
        }
    }

    # ---------------------------------------------------------------------------
    # SEO — иконка и robots.txt
    # ---------------------------------------------------------------------------
    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Next.js — /api/revalidate* (ISR), не Laravel
    # ---------------------------------------------------------------------------
    location ^~ /api/revalidate {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # API — Laravel: /api/* (кроме /api/revalidate* — см. выше), фиды, /up → index.php;
    #       FPM только для /index.php; прочие *.php на этом vhost — 404
    # ---------------------------------------------------------------------------
    location ~ ^/(api/.*|(ru|en)/feed(/|$)|up)$ {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_pass backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # ---------------------------------------------------------------------------
    # Next.js — frontend: / и /_next/*; остальное — try_files в public, иначе @nextjs
    # При обрыве HMR/WebSocket в dev при необходимости поднимите proxy_read_timeout.
    # ---------------------------------------------------------------------------
    location ~ ^/(?:_next/.*|)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~ /\.ht {
        deny all;
    }
}
