services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - laravel_network
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_DB: theins
      POSTGRES_USER: theins
      POSTGRES_PASSWORD: ith4837wiuesq93r8wgfiub
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - laravel_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
      - legacy_db
    networks:
      - laravel_network

  legacy_db:
    image: postgres:16
    container_name: legacy_db
    restart: always
    environment:
      POSTGRES_DB: theins_legacy
      POSTGRES_USER: theins
      POSTGRES_PASSWORD: ith4837wiuesq93r8wgfiub
    ports:
      - "5433:5432"  # Используем другой порт для внешнего доступа
    volumes:
      - legacy_db_data:/var/lib/postgresql/data
      - ./theins_prod_09112025_tar:/home/theins_prod_09112025_tar
    networks:
      - laravel_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./nginx/localhost.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - laravel_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - laravel_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - laravel_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - laravel_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduler
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - laravel_network
    command: >
      sh -c "
      while true; do
        php artisan schedule:run --verbose --no-interaction
        sleep 60
      done
      "

networks:
  laravel_network:
    driver: bridge

volumes:
  db_data:
  legacy_db_data:
  pgadmin_data:
  elasticsearch_data: 
  redis_data: 
